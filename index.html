<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Trying Flexbox</title>
        <meta charset="utf-8">
        <link href="Flexbox.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Trying FlexBox</h1>
        </header>
        <hr>
        <p>Flex Direction Row</p>
        <div id="container-row">
            <div class="green-cube"></div>
            <div class="green-cube"></div>
            <div class="green-cube"></div>
        </div>
        <hr>
        <p>Space Between</p>
        <div id="container-between">
            <div class="blue-cube"></div>
            <div class="blue-cube"></div>
            <div class="blue-cube"></div>
        </div>
        <hr>
        <p>Space Around</p>
        <div id="container-around">
            <div class="red-cube"></div>
            <div class="red-cube"></div>
            <div class="red-cube"></div>
        </div>
        <hr>
        <p>Flex Direction Column</p>
        <div id="container-column">
            <div class="purple-cube"></div>
            <div class="purple-cube"></div>
            <div class="purple-cube"></div>
        </div>
        <hr>
    </body>
</html>
